<body data-page="route" class="subpage">
<a class="skip-link" href="#routeMain">Skip to content</a>
<div id="siteChrome" data-chrome-active="route"><noscript><nav aria-label="Site"><a href="index.html?category=displays">Displays</a> · <a href="index.html?category=treats">Treat Stops</a> · <a href="index.html?category=events">Events</a> · <a href="shops.html">Shops &amp; Services</a></nav></noscript></div>
<script src="site-chrome.js"></script>
<main id="routeMain" class="subpage-main route-page">
  <h1>Your route</h1>
  <p class="subpage-dek" id="routeSummary" tabindex="-1" aria-live="polite">Loading your route…</p>
  <noscript><p class="subpage-dek">This page needs JavaScript to show your route. <a href="/">Return to the Hauntfinder map</a> to browse listings.</p></noscript>
  <div id="routeEmpty" class="route-page__empty" hidden>
    <p><strong>No stops on your route yet.</strong> Add displays, treat stops or events from the map, then come back here to order them and open directions.</p>
    <p id="routeEmptyStatus" role="status"></p>
    <a class="btn btn--route" href="/">Back to the map</a>
  </div>
  <section id="routeBody" class="route-page__body" aria-label="Route planner" hidden>
    <div class="route" id="routePlanner"></div>
    <div class="route-page__clear">
      <button type="button" class="route__linkbtn" id="clearRouteBtn" aria-expanded="false" aria-controls="clearConfirm">Clear route</button>
      <div id="clearConfirm" class="route-page__confirm" role="group" aria-labelledby="clearConfirmText" hidden>
        <p id="clearConfirmText">Remove all stops from your route?</p>
        <div class="route-page__confirm-actions"><button type="button" class="btn btn--outline" id="clearYes">Yes, clear route</button><button type="button" class="btn btn--route" id="clearNo">Keep my stops</button></div>
      </div>
    </div>
  </section>
  <p class="route-page__back"><a class="btn btn--outline" id="backToMap" href="/">← Back to map</a></p>
</main>
<footer class="subpage-foot">
