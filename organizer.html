oose a different photo</button><button id="organizerPost" class="btn">Post photo</button></div><p id="organizerStatus" role="status"></p><div id="organizerPhotos" class="host-current-photos"></div></section><section class="host-panel__section"><h2>Host links</h2><p>Send a host their private link. It lets them update only this listing and remove only their own photos.</p><button id="organizerCreateLink" class="btn">Create link</button><p id="organizerLink" role="status"></p><div id="organizerLinks"></div></section></div></section></main><script src="host-update-ui.js"></script><script src="assets/blob-client.js"></script><script src="organizer.js"></script></body></html>
