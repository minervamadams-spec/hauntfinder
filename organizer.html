<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hauntfinder organizer</title><link rel="stylesheet" href="styles.css"></head><body><main class="host-panel"><section class="host-panel__card"><h1>Hauntfinder organizer</h1><div id="organizerLogin"><label for="organizerKey">Organizer key</label><input id="organizerKey" type="password" autocomplete="current-password"><button id="organizerSignIn" class="btn">Sign in</button></div><div id="organizerApp" hidden><button id="organizerSignOut" class="btn btn--outline">Sign out</button><label for="organizerListing">Listing</label><select id="organizerListing"></select><section class="host-panel__section"><h2>Photos</h2><input id="organizerPhoto" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><div id="organizerPreview" class="host-photo-preview" hidden><img alt="Photo preview"><button id="organizerChange" class="btn btn--outline">Choose a different photo</button><button id="organizerPost" class="btn">Post photo</button></div><p id="organizerStatus" role="status"></p><div id="organizerPhotos" class="host-current-photos"></div></section><section class="host-panel__section"><h2>Host links</h2><p>Send a host their private link. It lets them update only this listing and remove only their own photos.</p><button id="organizerCreateLink" class="btn">Create link</button><p id="organizerLink" role="status"></p><div id="organizerLinks"></div></section></div></section></main><script src="host-update-ui.js"></script><script src="assets/blob-client.js"></script><script src="organizer.js"></script></body></html>
